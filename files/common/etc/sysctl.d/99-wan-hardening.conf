# WAN hardening for the external Ethernet path used by this board.
# WireGuard/AmneziaWG handshakes do not require redirects or source routing.
net.ipv4.conf.eth1.accept_redirects=0
net.ipv4.conf.eth1.send_redirects=0
net.ipv4.conf.eth1.accept_source_route=0
net.ipv4.conf.eth1.secure_redirects=0
net.ipv6.conf.eth1.accept_redirects=0
net.ipv6.conf.eth1.accept_ra=0
net.ipv6.conf.eth1.forwarding=0
net.ipv6.conf.eth1.disable_ipv6=1
